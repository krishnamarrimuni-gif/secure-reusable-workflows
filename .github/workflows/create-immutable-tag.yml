name: Create immutable tag

on:
  workflow_call:
    inputs:
      version:
        description: Semantic version, with or without a leading v
        required: true
        type: string
      version-type:
        description: major, minor, patch, or none
        required: false
        default: none
        type: string
      make-latest:
        description: Mark the GitHub release as latest
        required: false
        default: true
        type: boolean
    outputs:
      tag:
        value: ${{ jobs.tag.outputs.tag }}
      created:
        value: ${{ jobs.tag.outputs.created }}

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.normalize.outputs.tag }}
      created: ${{ steps.create.outputs.created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize and validate version
        id: normalize
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: $INPUT_VERSION" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "major=${version%%.*}" >> "$GITHUB_OUTPUT"

      - name: Create immutable tag if absent
        id: create
        env:
          TAG: ${{ steps.normalize.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; leaving it unchanged"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Update floating major tag
        if: ${{ steps.create.outputs.created == 'true' }}
        env:
          MAJOR: ${{ steps.normalize.outputs.major }}
          TAG: ${{ steps.normalize.outputs.tag }}
        run: |
          set -euo pipefail
          test -n "$MAJOR"
          git tag -fa "v$MAJOR" "$TAG" -m "Update v$MAJOR to $TAG"
          git push origin "v$MAJOR" --force

      - name: Create GitHub release
        if: ${{ steps.create.outputs.created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.normalize.outputs.tag }}
        run: |
          args=(--generate-notes --title "$TAG")
          if [[ "${{ inputs.make-latest }}" == true ]]; then args+=(--latest); else args+=(--latest=false); fi
          gh release create "$TAG" "${args[@]}"

      - name: Release summary
        if: always()
        run: |
          {
            echo "## Immutable release"
            echo "| Property | Value |"
            echo "| --- | --- |"
            echo "| Tag | ${{ steps.normalize.outputs.tag }} |"
            echo "| Version type | ${{ inputs.version-type }} |"
            echo "| Created | ${{ steps.create.outputs.created || 'false' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
